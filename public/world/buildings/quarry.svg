<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="155" rx="85" ry="18" fill="rgba(0,0,0,0.4)"/>
    <!-- Rocky Mountain Mine Entrance -->
    <polygon points="30,150 70,70 120,45 175,150" fill="#64748B" stroke="#334155" stroke-width="2.5"/>
    <polygon points="70,150 90,95 125,95 140,150" fill="#0F172A"/>
    <!-- Mine Shaft Timber Support Beams -->
    <line x1="82" y1="150" x2="88" y2="95" stroke="#78350F" stroke-width="5"/>
    <line x1="132" y1="150" x2="126" y2="95" stroke="#78350F" stroke-width="5"/>
    <line x1="85" y1="97" x2="130" y2="97" stroke="#78350F" stroke-width="5"/>
    <!-- Exposed Mineral Veins -->
    <polygon points="50,110 58,100 62,112 55,120" fill="#FBBF24" stroke="#D97706"/>
    <polygon points="145,80 155,75 158,88 150,92" fill="#38BDF8" stroke="#0284C7"/>
    <!-- Ore Minecart on Rails -->
    <g transform="translate(100, 140)">
      <line x1="-30" y1="12" x2="30" y2="12" stroke="#475569" stroke-width="3"/>
      <rect x="-14" y="-2" width="28" height="12" fill="#78350F" stroke="#334155" stroke-width="1.5" rx="2"/>
      <circle cx="-8" cy="10" r="3" fill="#1E293B"/>
      <circle cx="8" cy="10" r="3" fill="#1E293B"/>
      <circle cx="-4" cy="-3" r="3" fill="#FBBF24"/>
      <circle cx="4" cy="-3" r="3" fill="#FBBF24"/>
    </g>
  </svg>