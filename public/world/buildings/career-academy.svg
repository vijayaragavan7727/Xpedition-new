<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <defs>
      <linearGradient id="palaceMarble" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#CBD5E1"/>
      </linearGradient>
      <linearGradient id="royalDome" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#60A5FA"/>
        <stop offset="50%" stop-color="#2563EB"/>
        <stop offset="100%" stop-color="#1E3A8A"/>
      </linearGradient>
    </defs>
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="155" rx="85" ry="18" fill="rgba(0,0,0,0.4)"/>
    <!-- Marble Citadel Base -->
    <rect x="35" y="85" width="130" height="65" rx="4" fill="url(#palaceMarble)" stroke="#475569" stroke-width="2"/>
    <!-- Grand Entrance Pediment & Columns -->
    <polygon points="75,85 100,55 125,85" fill="url(#palaceMarble)" stroke="#475569" stroke-width="2"/>
    <g fill="#94A3B8" stroke="#334155" stroke-width="1.5">
      <rect x="80" y="85" width="6" height="60" rx="1"/>
      <rect x="94" y="85" width="6" height="60" rx="1"/>
      <rect x="108" y="85" width="6" height="60" rx="1"/>
      <rect x="122" y="85" width="6" height="60" rx="1"/>
    </g>
    <!-- Central Royal Gilded Dome -->
    <path d="M80,55 Q100,15 120,55 Z" fill="url(#royalDome)" stroke="#CA8A04" stroke-width="2.5"/>
    <circle cx="100" cy="15" r="4" fill="#FDE047" stroke="#A16207" stroke-width="1.5"/>
    <!-- Left & Right Wing Minor Domes -->
    <path d="M40,85 Q55,50 70,85 Z" fill="url(#royalDome)" stroke="#CA8A04" stroke-width="2"/>
    <path d="M130,85 Q145,50 160,85 Z" fill="url(#royalDome)" stroke="#CA8A04" stroke-width="2"/>
  </svg>