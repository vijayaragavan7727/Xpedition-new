<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <defs>
      <linearGradient id="arenaStone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F1F5F9"/>
        <stop offset="50%" stop-color="#94A3B8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
      <linearGradient id="bannerPurple" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#A855F7"/>
        <stop offset="100%" stop-color="#6B21A8"/>
      </linearGradient>
    </defs>
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="155" rx="85" ry="20" fill="rgba(0,0,0,0.4)"/>
    <!-- Circular Colosseum Battlement Base -->
    <ellipse cx="100" cy="115" rx="75" ry="38" fill="url(#arenaStone)" stroke="#334155" stroke-width="3"/>
    <!-- Inner Duel Sand Pit -->
    <ellipse cx="100" cy="115" rx="58" ry="26" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <!-- Arena Compass Rose / Crossed Swords Center -->
    <circle cx="100" cy="115" r="14" fill="#0284C7" stroke="#F8FAFC" stroke-width="1.5"/>
    <path d="M92,115 L108,115 M100,107 L100,123" stroke="#F8FAFC" stroke-width="2"/>
    <!-- Stone Battlements / Crenellations -->
    <g fill="#CBD5E1" stroke="#334155" stroke-width="1.5">
      <rect x="32" y="90" width="12" height="16" rx="2"/>
      <rect x="54" y="80" width="12" height="16" rx="2"/>
      <rect x="78" y="75" width="12" height="16" rx="2"/>
      <rect x="110" y="75" width="12" height="16" rx="2"/>
      <rect x="134" y="80" width="12" height="16" rx="2"/>
      <rect x="156" y="90" width="12" height="16" rx="2"/>
    </g>
    <!-- Royal War Crest Banner at Back -->
    <polygon points="90,40 110,40 110,85 100,75 90,85" fill="url(#bannerPurple)" stroke="#EAB308" stroke-width="1.5"/>
    <circle cx="100" cy="55" r="4" fill="#EAB308"/>
    <!-- Flaming Torch Braziers on Sides -->
    <g transform="translate(38, 95)">
      <rect x="-3" y="0" width="6" height="16" fill="#78350F"/>
      <circle cx="0" cy="-2" r="5" fill="#EF4444"/>
      <circle cx="0" cy="-4" r="3" fill="#FBBF24"/>
    </g>
    <g transform="translate(162, 95)">
      <rect x="-3" y="0" width="6" height="16" fill="#78350F"/>
      <circle cx="0" cy="-2" r="5" fill="#EF4444"/>
      <circle cx="0" cy="-4" r="3" fill="#FBBF24"/>
    </g>
  </svg>