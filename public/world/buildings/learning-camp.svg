<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <defs>
      <linearGradient id="tentBlue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3B82F6"/>
        <stop offset="50%" stop-color="#1D4ED8"/>
        <stop offset="100%" stop-color="#1E3A8A"/>
      </linearGradient>
      <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#FDE047"/>
        <stop offset="50%" stop-color="#EAB308"/>
        <stop offset="100%" stop-color="#CA8A04"/>
      </linearGradient>
      <linearGradient id="woodPlatform" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#92400E"/>
        <stop offset="100%" stop-color="#451A03"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.45"/>
      </filter>
    </defs>
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="155" rx="85" ry="20" fill="rgba(0,0,0,0.4)" filter="url(#shadow)"/>
    <!-- Wooden Platform Base -->
    <polygon points="30,140 170,140 185,155 15,155" fill="url(#woodPlatform)" stroke="#270F03" stroke-width="2"/>
    <polygon points="15,155 185,155 180,165 20,165" fill="#451A03"/>
    <!-- Tent Pavilion Body -->
    <polygon points="100,25 165,135 35,135" fill="url(#tentBlue)" stroke="#172554" stroke-width="2"/>
    <!-- Tent Ribs / Folds -->
    <path d="M100,25 Q115,80 165,135" stroke="#60A5FA" stroke-width="2.5" fill="none"/>
    <path d="M100,25 Q85,80 35,135" stroke="#1E40AF" stroke-width="2.5" fill="none"/>
    <path d="M100,25 L100,135" stroke="#93C5FD" stroke-width="2" fill="none"/>
    <!-- Marquee Valance Scallops -->
    <path d="M35,135 Q48,145 60,135 Q73,145 86,135 Q100,145 114,135 Q127,145 140,135 Q153,145 165,135" fill="url(#goldTrim)" stroke="#A16207" stroke-width="1.5"/>
    <!-- Tent Entrance Opening -->
    <polygon points="100,65 125,135 75,135" fill="#0F172A"/>
    <!-- Wooden Porch Posts -->
    <rect x="65" y="100" width="6" height="40" fill="#78350F" rx="2"/>
    <rect x="129" y="100" width="6" height="40" fill="#78350F" rx="2"/>
    <!-- Open Book Crest / Emblem -->
    <g transform="translate(100, 55) scale(0.9)">
      <polygon points="-16,-10 0,-14 16,-10 14,8 0,4 -14,8" fill="#F8FAFC" stroke="#CA8A04" stroke-width="1.5"/>
      <line x1="0" y1="-14" x2="0" y2="4" stroke="#94A3B8" stroke-width="1"/>
      <path d="M-12,-4 L-2,-6 M-12,1 L-2,-1" stroke="#3B82F6" stroke-width="1.5"/>
      <path d="M2,-6 L12,-4 M2,-1 L12,1" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
    <!-- Golden Finial & Pennant Flag at Top -->
    <circle cx="100" cy="22" r="5" fill="url(#goldTrim)" stroke="#A16207"/>
    <polygon points="100,18 100,2 125,10" fill="#EF4444" stroke="#B91C1C" stroke-width="1"/>
  </svg>