<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <defs>
      <linearGradient id="stoneLab" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#E2E8F0"/>
        <stop offset="100%" stop-color="#64748B"/>
      </linearGradient>
      <linearGradient id="domeBlue" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="50%" stop-color="#0284C7"/>
        <stop offset="100%" stop-color="#0369A1"/>
      </linearGradient>
      <linearGradient id="purpleMana" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C084FC"/>
        <stop offset="100%" stop-color="#7E22CE"/>
      </linearGradient>
    </defs>
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="155" rx="80" ry="18" fill="rgba(0,0,0,0.4)"/>
    <!-- Main Stone Laboratory Base -->
    <rect x="40" y="90" width="120" height="60" rx="6" fill="url(#stoneLab)" stroke="#334155" stroke-width="2"/>
    <!-- Laboratory Door -->
    <path d="M85,150 L85,115 Q100,105 115,115 L115,150 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <!-- Glowing Alchemical Stained Glass Windows -->
    <circle cx="60" cy="115" r="10" fill="url(#purpleMana)" stroke="#EAB308" stroke-width="2"/>
    <circle cx="140" cy="115" r="10" fill="url(#purpleMana)" stroke="#EAB308" stroke-width="2"/>
    <!-- Tiled Upper Roof -->
    <polygon points="30,95 100,45 170,95" fill="url(#domeBlue)" stroke="#0C4A6E" stroke-width="2"/>
    <!-- Observatory Brass Spire & Glass Dome -->
    <circle cx="100" cy="45" r="18" fill="rgba(56,189,248,0.7)" stroke="#F59E0B" stroke-width="2.5"/>
    <ellipse cx="100" cy="45" rx="18" ry="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <!-- Alchemical Flask / Lightning Rod -->
    <line x1="100" y1="27" x2="100" y2="10" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="100" cy="8" r="4" fill="#A855F7" stroke="#F59E0B" stroke-width="1.5"/>
  </svg>