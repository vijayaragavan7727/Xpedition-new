<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="155" rx="85" ry="18" fill="rgba(0,0,0,0.4)"/>
    <!-- Timber Log Cabin -->
    <rect x="50" y="85" width="100" height="65" rx="4" fill="#92400E" stroke="#451A03" stroke-width="2.5"/>
    <!-- Horizontal Log Lines -->
    <line x1="50" y1="100" x2="150" y2="100" stroke="#451A03" stroke-width="2"/>
    <line x1="50" y1="115" x2="150" y2="115" stroke="#451A03" stroke-width="2"/>
    <line x1="50" y1="130" x2="150" y2="130" stroke="#451A03" stroke-width="2"/>
    <!-- Gabled Cedar Roof -->
    <polygon points="40,88 100,45 160,88" fill="#B45309" stroke="#78350F" stroke-width="2"/>
    <!-- Stacked Timber Logs Beside Cabin -->
    <g transform="translate(145, 130)">
      <circle cx="0" cy="10" r="8" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
      <circle cx="14" cy="10" r="8" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
      <circle cx="7" cy="-2" r="8" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
    </g>
    <!-- Sawmill Circular Blade -->
    <circle cx="35" cy="135" r="14" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <circle cx="35" cy="135" r="4" fill="#0F172A"/>
  </svg>