<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <defs>
      <linearGradient id="roofTile" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2563EB"/>
        <stop offset="100%" stop-color="#1E3A8A"/>
      </linearGradient>
      <linearGradient id="timberGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#92400E"/>
        <stop offset="100%" stop-color="#78350F"/>
      </linearGradient>
    </defs>
    <!-- Ground Shadow -->
    <ellipse cx="100" cy="155" rx="85" ry="18" fill="rgba(0,0,0,0.4)"/>
    <!-- Stone & Timber Base -->
    <rect x="50" y="85" width="105" height="65" rx="4" fill="url(#timberGrad)" stroke="#451A03" stroke-width="2"/>
    <!-- Workshop Gabled Roof -->
    <polygon points="40,88 102,40 165,88" fill="url(#roofTile)" stroke="#172554" stroke-width="2"/>
    <!-- Stone Forge Chimney -->
    <rect x="130" y="30" width="20" height="45" fill="#64748B" stroke="#334155" stroke-width="2"/>
    <rect x="127" y="26" width="26" height="6" fill="#475569" rx="2"/>
    <!-- Chimney Smoke Puffs -->
    <circle cx="140" cy="18" r="6" fill="rgba(203,213,225,0.6)"/>
    <circle cx="145" cy="8" r="8" fill="rgba(203,213,225,0.4)"/>
    <!-- Construction Crane Arm on Left -->
    <line x1="45" y1="150" x2="30" y2="50" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="50" x2="15" y2="60" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="60" x2="18" y2="95" stroke="#64748B" stroke-width="2"/>
    <!-- Hoist Hook & Cargo Crate -->
    <rect x="10" y="95" width="16" height="16" fill="#D97706" stroke="#78350F" stroke-width="1.5"/>
    <!-- Workshop Gear / Cog Emblem on Front -->
    <g transform="translate(102, 68) scale(0.8)">
      <circle cx="0" cy="0" r="12" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#1E3A8A"/>
    </g>
  </svg>